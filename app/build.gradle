apply plugin: 'com.android.application'

// load local release signing values
// Note: file is ignored by Git.
def releaseSigningPropertiesFile = rootProject.file('signing.properties')
def releaseSigningProperties = new Properties()

if (releaseSigningPropertiesFile.exists()) {
    releaseSigningPropertiesFile.withInputStream { signingPropertiesInputStream ->
        releaseSigningProperties.load(signingPropertiesInputStream)
    }
}

android {
    compileSdkVersion rootProject.ext.CompileSdk
    buildToolsVersion rootProject.ext.BuildTools // use same build tools version than root

    defaultConfig {
        applicationId "io.github.PapirusDevelopmentTeam.papirus_icons"
        minSdkVersion rootProject.ext.MinSdk
        targetSdkVersion rootProject.ext.TargetSdk
        versionCode 13
        versionName "20260801.2"
        multiDexEnabled true

        // custom apk file name, use version name instead of version code. eg. papirus-android-v20260801-release.apk
        setArchivesBaseName("${parent.name}-v${versionName}")
    }

    bundle {
        language {
            enableSplit false
        }
    }
    
    signingConfigs {
        release {
            if (releaseSigningPropertiesFile.exists()) {
                storeFile rootProject.file(releaseSigningProperties['storeFile'])
                storePassword releaseSigningProperties['storePassword']
                keyAlias releaseSigningProperties['keyAlias']
                keyPassword releaseSigningProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            debuggable false
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    /*
     * CandyBar Material Dashboard Library
     *
     * TODO: How to update the dashboard?!
     * Check this update guide for every version
     *      - https://github.com/zixpo/candybar-sample/wiki/Updating-the-dashboard
     * If you've missed some versions you've to also follow update guide for those versions
     */

    implementation project(':candybar_library')

    // TODO: Remove `//` below to enable OneSignal
    //implementation 'com.onesignal:OneSignal:[4.0.0, 4.99.99]'
}
