buildscript {
    repositories {
        mavenCentral()
        google()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:9.2.1'
    }
}

allprojects {
    repositories {
        mavenCentral()
        google()
        maven { url "https://jitpack.io" }
        maven { url 'https://maven.google.com' }
    }

    rootProject.ext {
        VersionName = '3.23.0'
        MinSdk = 21
        TargetSdk = 36
        CompileSdk = 36
    }
}

tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}
